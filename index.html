<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YATM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <h1 data-i18n-key="appTitle">Yet Another Task Manager</h1>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <nav class="app-nav">
                <button class="nav-btn active" data-view="tasks-view" data-i18n-key="navTasks">Tasks</button>
                <button class="nav-btn" data-view="settings-view" data-i18n-key="navSettings">Settings</button>
            </nav>
        </header>

        <div id="tasks-view" class="view active-view">
            <main class="main-content">
                <section class="task-input-section">
                    <form id="add-task-form">
                        <input type="text" id="task-input" data-i18n-key="addTaskPlaceholder" placeholder="Add a new task..." aria-label="New task">
                        <button type="submit" data-i18n-key="addTaskAria" aria-label="Add task">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </form>
                </section>

                <section class="task-list-section">
                    <div id="empty-state" class="empty-state">
                        <div class="empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="15" y2="17"></line><line x1="9" y1="9" x2="10" y2="9"></line></svg>
                        </div>
                        <p data-i18n-key="emptyStateText">No tasks yet!</p>
                    </div>
                    <ul id="task-list" class="task-list">
                        <!-- Les tâches seront injectées ici par JavaScript -->
                    </ul>
                </section>
            </main>
            <footer class="footer">
                <div class="footer-stats">
                    <span id="task-counter">0 tasks remaining</span>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all" data-i18n-key="filterAll">All</button>
                    <button class="filter-btn" data-filter="active" data-i18n-key="filterActive">Active</button>
                    <button class="filter-btn" data-filter="completed" data-i18n-key="filterCompleted">Completed</button>
                </div>
                <button id="clear-completed" class="clear-btn" data-i18n-key="clearCompleted">Clear completed</button>
            </footer>
        </div>

    <div id="settings-view" class="view">
        <main class="main-content">
            <section class="settings-section">
                <div class="setting-item">
                    <label for="theme-switch" data-i18n-key="darkThemeLabel">Dark Theme</label>
                    <label class="switch">
                        <input type="checkbox" id="theme-switch">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label data-i18n-key="languageLabel">Language</label>
                    <div class="custom-select-wrapper">
                        <div class="custom-select">
                            <div class="custom-select__trigger">
                                <span>English</span>
                                <div class="arrow"></div>
                            </div>
                            <div class="custom-options">
                               <!-- Les options de langue seront injectées ici par JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
